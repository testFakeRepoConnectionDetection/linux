# Production values for the linux-perf-gateway chart.
replicaCount: 3
image:
  repository: registry.corp.internal/platform/linux-perf-gateway
  tag: 1.4.2-corp.1
resources:
  limits:
    cpu: "4"
    memory: 8Gi
env:
  # Corporate Accounts Credit Scoring
  - name: CORPORATE_ACCOUNTS_CREDIT_SCORING_URL
    value: https://corporate-accounts-credit-scoring.svc.corp.internal/api/v1
  - name: REGULATORY_REPORTING_EVIDENCE_ARCHIVE_EMEA_URL
    value: https://regulatory-reporting-evidence-archive-emea.svc.corp.internal/api/v1
  - name: EQUITY_PNL_EXPLAIN_AMER_URL
    value: https://equity-pnl-explain-amer.svc.corp.internal/api/v1
  - name: RETAIL_ACCOUNTS_CUSTOMER_ONBOARDING_AMER_URL
    value: https://retail-accounts-customer-onboarding-amer.svc.corp.internal/api/v1
ingress:
  enabled: true
  host: linux-perf.corp.internal
  allowedSourceNamespaces:
    - equity-derivatives-order-router
